version: '3.8'

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ft_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       finance_tracker
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ft_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST:         postgres
      DB_PORT:         5432
      DB_NAME:         finance_tracker
      DB_USERNAME:     postgres
      DB_PASSWORD:     ${DB_PASSWORD:-postgres}
      JWT_SECRET:      ${JWT_SECRET:-FinanceTrackerSecretKey2024SuperLongAtLeast64CharsForSecurity!!!}
      GEMINI_API_KEY:  ${GEMINI_API_KEY:-your_gemini_api_key_here}
      MAIL_USERNAME:   ${MAIL_USERNAME:-your_email@gmail.com}
      MAIL_PASSWORD:   ${MAIL_PASSWORD:-your_gmail_app_password}
      FRONTEND_URL:    ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Vite/React Frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    container_name: ft_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  pgdata:
    driver: local
