# ── Server Configuration ───────────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/api

# ── DataSource Properties ──────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finance_tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ── JPA / Hibernate Settings ───────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── JWT Authentication ──────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:ZmluYW5jZS10cmFja2VyLXN1cGVyLXNlY3JldC1rZXktZm9yLWp3dC0yMDI0}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ── Gmail SMTP Config ───────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:prv784@gmail.com}
spring.mail.password=${MAIL_PASSWORD:vqxbgpubppmhqpix}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# ── Google Gemini AI Core ───────────────────────────────────────────────────
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}
app.gemini.max-output-tokens=2000

# ── Application Cross-Origin Routing ───────────────────────────────────────────
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.otp.expiry-minutes=10
app.reset-token.expiry-hours=1

# ── OpenAPI Spec / Swagger ──────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Spring Boot Actuator Monitoring ─────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── Jackson JSON Engine ─────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ── Logging Allocations ─────────────────────────────────────────────────────────
logging.level.com.financetracker=INFO
logging.level.org.springframework.security=WARN